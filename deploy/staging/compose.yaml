name: us2-xboard-node

services:
  xboard-node:
    image: ${XBOARD_NODE_IMAGE:?XBOARD_NODE_IMAGE is required}
    container_name: xboard-node
    restart: unless-stopped
    init: true
    network_mode: host
    env_file:
      - ./runtime.env
    volumes:
      - ./config.yml:/etc/xboard-node/config.yml:ro
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:65530/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  xboard-node-edge:
    image: ${XBOARD_NODE_IMAGE:?XBOARD_NODE_IMAGE is required}
    container_name: xboard-node-edge
    restart: unless-stopped
    init: true
    network_mode: host
    entrypoint: ["/usr/bin/caddy"]
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    env_file:
      - ./edge.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./cover-public:/srv/cover:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    mem_limit: 96m
    mem_reservation: 24m
    cpus: 0.5
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --header=\"Host: $${NODE_DOMAIN}\" -q -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
