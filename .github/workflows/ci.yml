name: CI and Publish

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Formal version (vX.Y.Z); publish only, never deploy. Empty keeps the transitional workflow."
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: voidintheshell/xboard-node

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      - name: Run tests
        run: make test

      - name: Build Hugo cover site
        shell: bash
        run: |
          set -Eeuo pipefail
          HUGO_VERSION=0.148.2
          HUGO_ARCHIVE="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          HUGO_SHA256=b2fbef73c965ff439ccca0bdf15d7ca64f59363d62916326e24d5552e6968aa3
          HUGO_DIR="${RUNNER_TEMP}/hugo-bin"
          install -d -m 700 "${HUGO_DIR}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/${HUGO_ARCHIVE}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_ARCHIVE}"
          printf '%s  %s\n' "${HUGO_SHA256}" "${RUNNER_TEMP}/${HUGO_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${HUGO_ARCHIVE}" -C "${HUGO_DIR}" hugo
          "${HUGO_DIR}/hugo" \
            --source deploy/staging/cover \
            --destination "${RUNNER_TEMP}/cover-public" \
            --minify \
            --gc
          test -s "${RUNNER_TEMP}/cover-public/index.html"
          test -s "${RUNNER_TEMP}/cover-public/404.html"
          grep -q 'Pacific Atlas' "${RUNNER_TEMP}/cover-public/index.html"
          grep -q 'This trail ends here' "${RUNNER_TEMP}/cover-public/404.html"

      - name: Validate staging deployment assets
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/staging/deploy.sh
          docker compose -f deploy/staging/compose.yaml config --no-interpolate > /dev/null
          sed -e 's|__NODE_DOMAIN__|validation.invalid|g' \
            -e 's|__NODE_WS_PATH__|/validation-only-path|g' \
            deploy/staging/Caddyfile.template > "${RUNNER_TEMP}/Caddyfile"
          caddy_diff=$(docker run --rm --entrypoint caddy \
            --volume "${RUNNER_TEMP}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            fmt --diff /etc/caddy/Caddyfile)
          printf '%s\n' "${caddy_diff}"
          if grep -Eq '^[+-]' <<< "${caddy_diff}"; then
            echo "Caddyfile.template is not formatted" >&2
            exit 1
          fi
          docker run --rm --entrypoint caddy \
            --volume "${RUNNER_TEMP}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Upload staging cover artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-cover-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cover-public
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [test, prepare-release]
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.prepare-release.result == 'success' || github.event_name == 'pull_request')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build binaries
        env:
          VERSION: ${{ needs.prepare-release.outputs.version || format('build-{0}-{1}', github.run_id, github.run_attempt) }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            make build-linux
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            make build-linux-arm64
          fi

      - name: Verify binary version and architecture
        env:
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version || format('build-{0}-{1}', github.run_id, github.run_attempt) }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          file "xboard-node-linux-$TARGET_ARCH" "xbctl-linux-$TARGET_ARCH"
          if [ "$TARGET_ARCH" = amd64 ]; then
            ./xboard-node-linux-amd64 -v | grep -F -- "$EXPECTED_VERSION"
            ./xbctl-linux-amd64 version | grep -F -- "$EXPECTED_VERSION"
          fi

      - name: Upload xboard-node artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload xbctl artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}


  prepare-release:
    name: Freeze version and release plan
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      plan_artifact: release-plan-${{ steps.plan.outputs.version }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Prepare exact version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 .github/scripts/release.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan-${{ steps.plan.outputs.version }}
          overwrite: true
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  build-and-push:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, prepare-release]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Set build time
        id: build-time
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Verify checkout and load frozen plan
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}
      - name: Preserve an already built version on retry
        id: existing-image
        run: python3 .github/scripts/release.py image-check

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        if: steps.existing-image.outputs.exists != 'true'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare-release.outputs.version }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Verify published runtime version on both architectures
        env:
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -Eeuo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${EXPECTED_VERSION}"
          for platform in linux/amd64 linux/arm64; do
            actual=$(docker run --rm --platform "$platform" --entrypoint xboard-node "$image" -v | awk '{print $2}')
            test "$actual" = "$EXPECTED_VERSION"
          done

  release:
    name: Publish complete version
    needs: [prepare-release, build-and-push, build]
    if: needs.prepare-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: "*-linux-*"
          merge-multiple: true
          path: release-binaries
      - name: Publish only after every required artifact is ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/release.py complete
