name: CI and Publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: voidintheshell/xboard-node

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      - name: Run tests
        run: make test

      - name: Build Hugo cover site
        shell: bash
        run: |
          set -Eeuo pipefail
          HUGO_VERSION=0.148.2
          HUGO_ARCHIVE="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          HUGO_SHA256=b2fbef73c965ff439ccca0bdf15d7ca64f59363d62916326e24d5552e6968aa3
          HUGO_DIR="${RUNNER_TEMP}/hugo-bin"
          install -d -m 700 "${HUGO_DIR}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/${HUGO_ARCHIVE}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_ARCHIVE}"
          printf '%s  %s\n' "${HUGO_SHA256}" "${RUNNER_TEMP}/${HUGO_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${HUGO_ARCHIVE}" -C "${HUGO_DIR}" hugo
          "${HUGO_DIR}/hugo" \
            --source deploy/staging/cover \
            --destination "${RUNNER_TEMP}/cover-public" \
            --minify \
            --gc
          test -s "${RUNNER_TEMP}/cover-public/index.html"
          test -s "${RUNNER_TEMP}/cover-public/404.html"
          grep -q 'Pacific Atlas' "${RUNNER_TEMP}/cover-public/index.html"
          grep -q 'This trail ends here' "${RUNNER_TEMP}/cover-public/404.html"

      - name: Validate staging deployment assets
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/staging/deploy.sh
          docker compose -f deploy/staging/compose.yaml config --no-interpolate > /dev/null
          sed -e 's|__NODE_DOMAIN__|validation.invalid|g' \
            -e 's|__NODE_WS_PATH__|/validation-only-path|g' \
            deploy/staging/Caddyfile.template > "${RUNNER_TEMP}/Caddyfile"
          caddy_diff=$(docker run --rm --entrypoint caddy \
            --volume "${RUNNER_TEMP}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            fmt --diff /etc/caddy/Caddyfile)
          printf '%s\n' "${caddy_diff}"
          if grep -Eq '^[+-]' <<< "${caddy_diff}"; then
            echo "Caddyfile.template is not formatted" >&2
            exit 1
          fi
          docker run --rm --entrypoint caddy \
            --volume "${RUNNER_TEMP}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Upload staging cover artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-cover-${{ github.sha }}
          path: ${{ runner.temp }}/cover-public
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build binaries
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

      - name: Upload xboard-node artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload xbctl artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}

  build-and-push:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set build time
        id: build-time
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  release:
    name: Release binaries
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            dist/xboard-node-linux-amd64
            dist/xboard-node-linux-arm64
            dist/xbctl-linux-amd64
            dist/xbctl-linux-arm64
